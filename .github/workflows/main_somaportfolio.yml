name: Deploy portfolio to Azure Web App - somaportfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Prepare portfolio files
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and prepare website
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "index.html",
            "web.config",
            "favicon.svg",
            "assets"
          )

          foreach ($item in $required) {
            if (!(Test-Path $item)) {
              throw "Missing $item at repository root. Upload the extracted AppService_Ready files."
            }
          }

          New-Item -ItemType Directory -Path published -Force | Out-Null

          Copy-Item index.html, web.config, favicon.svg -Destination published
          Copy-Item assets -Destination published -Recurse

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: ASP-app
          path: published/
          if-no-files-found: error

  deploy:
    name: Deploy to Azure
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: ASP-app
          path: website

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6C8117172E5840E8A45D24481C63EEA0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E763BB48DDB3406282D42AA7315DC5D3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_906823FE00CE4281B470A03E9BADFD87 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: somaportfolio
          slot-name: Production
          package: website
