name: Build and deploy ASP.NET app to Azure Web App - LPT

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Leave empty if the repository has only one .csproj.
  # Otherwise enter the web project path, e.g. src/LPT/LPT.csproj
  WEB_PROJECT: ''

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find application project
        id: project
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WEB_PROJECT)) {
            $project = Join-Path $env:GITHUB_WORKSPACE $env:WEB_PROJECT

            if (-not (Test-Path -LiteralPath $project -PathType Leaf)) {
              throw "WEB_PROJECT does not exist: $project"
            }
          }
          else {
            $projects = @(
              Get-ChildItem -Path $env:GITHUB_WORKSPACE `
                -Recurse -File -Filter *.csproj |
              Where-Object {
                $_.FullName -notmatch '[\\/](bin|obj)[\\/]'
              }
            )

            if ($projects.Count -eq 0) {
              throw "No .csproj found. Upload the application source project, or use a workflow appropriate for a website without a project file."
            }

            if ($projects.Count -gt 1) {
              $projects | ForEach-Object {
                Write-Host $_.FullName
              }
              throw "Multiple projects found. Set WEB_PROJECT to the web application's .csproj path."
            }

            $project = $projects[0].FullName
          }

          Write-Host "Building project: $project"
          "path=$project" >> $env:GITHUB_OUTPUT

      - name: Restore, build and publish
        env:
          PROJECT_PATH: ${{ steps.project.outputs.path }}
        run: |
          $publishPath = Join-Path $env:GITHUB_WORKSPACE "published"

          & msbuild $env:PROJECT_PATH `
            /nologo `
            /verbosity:minimal `
            /restore `
            /p:RestorePackagesConfig=true `
            /p:Configuration=Release `
            /p:DeployOnBuild=true `
            /p:DeployDefaultTarget=WebPublish `
            /p:WebPublishMethod=FileSystem `
            "/p:PublishUrl=$publishPath"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if (-not (Test-Path "$publishPath\web.config")) {
            throw "Published web.config was not found. Verify that WEB_PROJECT points to an ASP.NET Framework web application."
          }

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: ASP-app
          path: ${{ github.workspace }}/published/
          if-no-files-found: error

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download published application
        uses: actions/download-artifact@v4
        with:
          name: ASP-app
          path: published

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_57DFE9A7BB66493D9D2C1F7891024887 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_05437097057E4D1E9CCDD2770DB300AB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2EF40C985B6646D6A3624D56534B0BF4 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: LPT
          slot-name: Production
          package: published
