name: Deploy website to Azure Web App - LPT

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Enter the exact existing Azure Web App name.
  AZURE_WEBAPP_NAME: 'LPT'

  # Use '.' if website files are in the repository root.
  WEBSITE_SOURCE: '.'

jobs:
  deploy:
    name: Deploy website
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:GITHUB_WORKSPACE $env:WEBSITE_SOURCE
          $destination = Join-Path $env:RUNNER_TEMP "website"

          if (-not (Test-Path -LiteralPath $source -PathType Container)) {
            throw "Website source folder does not exist: $source"
          }

          New-Item -ItemType Directory `
            -Path $destination `
            -Force | Out-Null

          Get-ChildItem -LiteralPath $source -Force |
            Where-Object {
              $_.Name -notin @(".git", ".github")
            } |
            ForEach-Object {
              Copy-Item -LiteralPath $_.FullName `
                -Destination $destination `
                -Recurse `
                -Force
            }

          $files = @(
            Get-ChildItem -LiteralPath $destination -Recurse -File
          )

          if ($files.Count -eq 0) {
            throw "No website files found for deployment."
          }

          Write-Host "Prepared $($files.Count) website files."

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_57DFE9A7BB66493D9D2C1F7891024887 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_05437097057E4D1E9CCDD2770DB300AB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2EF40C985B6646D6A3624D56534B0BF4 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ${{ runner.temp }}/website
