name: Deploy website to Azure Web App - LPT

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'LPT'
  WEBSITE_SOURCE: '.'

jobs:
  deploy:
    name: Deploy website
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Azure secrets
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $required = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID"
          )

          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)

            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing repository secret: $name"
            }
          }

          Write-Host "All required Azure secrets are present."

      - name: Prepare website files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:GITHUB_WORKSPACE $env:WEBSITE_SOURCE
          $destination = Join-Path $env:RUNNER_TEMP "website"

          if (-not (Test-Path -LiteralPath $source -PathType Container)) {
            throw "Website source folder does not exist: $source"
          }

          New-Item -ItemType Directory `
            -Path $destination `
            -Force | Out-Null

          Get-ChildItem -LiteralPath $source -Force |
            Where-Object {
              $_.Name -notin @(".git", ".github")
            } |
            ForEach-Object {
              Copy-Item -LiteralPath $_.FullName `
                -Destination $destination `
                -Recurse `
                -Force
            }

          $files = @(
            Get-ChildItem -LiteralPath $destination -Recurse -File
          )

          if ($files.Count -eq 0) {
            throw "No website files found for deployment."
          }

          Write-Host "Prepared $($files.Count) website files."

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ${{ runner.temp }}/website
